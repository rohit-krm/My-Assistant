<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GyanAI Hub - विशेषज्ञ सलाहकार प्रणाली</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: { fontFamily: { sans: ['"Inter"', '"Noto Sans Devanagari"', 'sans-serif'] } }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-animate { animation: fadeSlideUp 0.22s ease-out forwards; }

    .ai-rich-body b, .ai-rich-body strong { font-weight: 700; color: #0f172a; }
    .ai-rich-body em {
      display: block;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed #cbd5e1;
      font-size: 0.82em;
      color: #475569;
      font-style: italic;
    }
    .ai-heading {
      display: block;
      font-weight: 700;
      font-size: 1.05em;
      color: #0f172a;
      margin-top: 8px;
      margin-bottom: 2px;
    }
    .wave-bar {
      width: 3.5px;
      height: 6px;
      border-radius: 9999px;
      transition: height 0.08s ease;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex antialiased">

  <!-- Mobile Backdrop -->
  <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-30 hidden lg:hidden"></div>

  <!-- LEFT SIDEBAR: Assistants Navigation -->
  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl lg:shadow-none">
    
    <!-- Brand Header -->
    <div class="h-16 px-5 border-b border-slate-100 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-xs">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-base leading-tight">GyanAI Hub</h1>
          <p class="text-[11px] text-slate-500 font-medium">विशेषज्ञ सलाहकार प्रणाली</p>
        </div>
      </div>
      <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-400 hover:text-slate-600 rounded-lg">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Dynamic Assistants List -->
    <div class="flex-1 overflow-y-auto p-3.5 space-y-5">
      <div>
        <div class="px-2.5 mb-2 flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">आपके विशेषज्ञ (Assistants)</span>
          <span id="assistantCountBadge" class="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">0</span>
        </div>
        <div id="assistantList" class="space-y-1.5"></div>
      </div>
    </div>

    <!-- Backend Status & User Footer -->
    <div class="p-3.5 border-t border-slate-100 bg-slate-50/70 shrink-0">
      <div class="flex items-center justify-between mb-2.5 px-1">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2.5 w-2.5">
            <span id="syncPingDot" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
            <span id="syncSolidDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
          </span>
          <span id="backendStatusText" class="text-xs font-medium text-slate-600">Connecting...</span>
        </div>
        <button onclick="syncBackendModes()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
          <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5"></i>
          <span>रिफ्रेश</span>
        </button>
      </div>
      <div class="flex items-center gap-2.5 p-2 rounded-xl bg-white border border-slate-200/80">
        <div id="userInitialAvatar" class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center shrink-0">म</div>
        <div class="min-w-0 flex-1">
          <p id="sidebarUserName" class="text-xs font-semibold text-slate-800 truncate">M.K. Maurya</p>
          <p class="text-[11px] text-slate-400 truncate">सक्रिय सदस्य</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CHAT WORKSPACE -->
  <main class="flex-1 flex flex-col min-w-0 bg-slate-50/50 relative">
    
    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 z-20 shrink-0">
      <div class="h-16 px-4 lg:px-6 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-slate-600 hover:bg-slate-100 rounded-xl">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div id="headerAvatar" class="w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0 shadow-xs bg-emerald-600">
            <i data-lucide="sprout" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h2 id="headerTitle" class="font-bold text-slate-900 text-base sm:text-lg truncate">Acupressure Expert</h2>
              <span id="headerConnBadge" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-50 text-amber-700 border border-amber-200/60">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> कनेक्ट हो रहा है...
              </span>
            </div>
            <p id="headerSubtitle" class="text-xs text-slate-500 truncate"></p>
          </div>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <div class="hidden sm:flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200/60">
            <button onclick="changeFontSize(-1)" class="px-2 py-1 text-xs font-semibold text-slate-600 hover:bg-white rounded-lg">A-</button>
            <span id="fontSizeDisplay" class="px-1.5 text-[11px] font-medium text-slate-500">17px</span>
            <button onclick="changeFontSize(1)" class="px-2 py-1 text-xs font-semibold text-slate-600 hover:bg-white rounded-lg">A+</button>
          </div>

          <div class="relative">
            <button onclick="toggleHeaderMenu()" id="headerMenuBtn" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl">
              <i data-lucide="more-vertical" class="w-5 h-5"></i>
            </button>
            <div id="headerDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-lg border border-slate-200/80 py-2 z-50">
              <div class="sm:hidden px-4 py-2.5 border-b border-slate-100 flex items-center justify-between">
                <span class="text-xs font-medium text-slate-600">अक्षर आकार</span>
                <div class="flex items-center gap-1 bg-slate-100 rounded-lg p-0.5">
                  <button onclick="changeFontSize(-1)" class="px-2 py-1 text-xs font-semibold">A-</button>
                  <span id="fontSizeDisplayMobile" class="text-xs px-1">17</span>
                  <button onclick="changeFontSize(1)" class="px-2 py-1 text-xs font-semibold">A+</button>
                </div>
              </div>
              <button onclick="clearCurrentChat()" class="w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2.5">
                <i data-lucide="trash-2" class="w-4 h-4 text-slate-400"></i>
                <span>वर्तमान चैट साफ़ करें</span>
              </button>
              <button onclick="exportChat()" class="w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2.5">
                <i data-lucide="download" class="w-4 h-4 text-slate-400"></i>
                <span>चैट डाउनलोड करें</span>
              </button>
              <div class="my-1 border-t border-slate-100"></div>
              <button onclick="logoutUser()" class="w-full px-4 py-2.5 text-left text-sm text-rose-600 hover:bg-rose-50 flex items-center gap-2.5">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>लॉगआउट करें</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Dynamic Modes Pills Bar -->
      <div class="px-4 lg:px-6 py-2 bg-slate-50/90 border-t border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar">
        <span class="text-xs font-semibold text-slate-400 shrink-0 flex items-center gap-1 mr-1">
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i> मोड:
        </span>
        <div id="modePillsContainer" class="flex items-center gap-2"></div>
      </div>
    </header>

    <!-- Chat Messages Canvas -->
    <div id="chatContainer" class="flex-1 overflow-y-auto no-scrollbar px-4 lg:px-8 py-5 scroll-smooth">
      <div id="messagesWrapper" class="max-w-3xl mx-auto space-y-4 pb-4"></div>
    </div>

    <!-- Bottom Input Bar -->
    <div class="bg-white border-t border-slate-200 px-3 lg:px-8 py-3 shrink-0">
      <div class="max-w-3xl mx-auto">
        <!-- Image Preview Strip -->
        <div id="attachmentPreview" class="hidden mb-2 p-2 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <img id="attachmentThumb" src="" class="w-10 h-10 rounded-lg object-cover border border-slate-200" alt="Preview">
            <span id="attachmentName" class="text-xs font-medium text-slate-700">image.jpg</span>
          </div>
          <button type="button" onclick="removeAttachment()" class="p-1 text-slate-400 hover:text-rose-600 rounded-lg">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-end gap-2 bg-slate-100/90 border border-slate-200/90 focus-within:border-slate-400 focus-within:bg-white rounded-2xl p-1.5 transition-all">
          <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
          
          <button type="button" id="attachBtn" onclick="document.getElementById('fileInput').click()" class="p-2.5 text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 rounded-xl shrink-0" title="चित्र संलग्न करें">
            <i data-lucide="paperclip" class="w-5 h-5"></i>
          </button>

          <textarea 
            id="messageInput" 
            rows="1" 
            placeholder="लक्षण या समस्या यहाँ लिखें..." 
            class="w-full bg-transparent border-0 resize-none py-2 px-1 text-slate-800 placeholder-slate-400 text-base max-h-32 leading-relaxed outline-none no-scrollbar"
            oninput="onInputTextChanged(this)"
            onkeydown="handleKeyDown(event)"
          ></textarea>

          <!-- Live Horizontal Audio Wave Box -->
          <div id="voiceWaveBox" class="hidden flex-1 items-center justify-between gap-2 px-2 py-1.5">
            <button type="button" onclick="cancelVoiceRecording()" class="p-1.5 rounded-full bg-rose-100 text-rose-600 hover:bg-rose-200 shrink-0" title="रद्द करें">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <div id="waveBarsContainer" class="flex-1 flex items-center justify-center gap-1 h-7 overflow-hidden"></div>
            <span id="voiceLiveLabel" class="text-xs font-semibold text-rose-600 whitespace-nowrap shrink-0">● सुन रहा हूँ...</span>
          </div>

          <button type="button" id="primaryActionBtn" onclick="handlePrimaryActionClick()" class="p-2.5 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 shadow-xs transition-all shrink-0 flex items-center justify-center">
            <i data-lucide="mic" id="primaryActionIcon" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- PIN Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center gap-2 text-slate-900">
        <i data-lucide="lock" class="w-5 h-5 text-emerald-600"></i>
        <h3 class="text-lg font-bold">सुरक्षित प्रवेश</h3>
      </div>
      <p class="text-xs text-slate-500">कृपया अपना नाम और सुरक्षा एक्सेस पिन दर्ज करें।</p>
      <input type="text" id="authNameInput" placeholder="आपका नाम (उदा. M.K. Maurya)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-500">
      <input type="password" id="authPinInput" placeholder="एक्सेस पिन (Security PIN)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-500">
      <p id="authErrorMsg" class="hidden text-xs font-semibold text-rose-600"></p>
      <button type="button" onclick="submitAuthLogin()" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold">प्रवेश करें</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
    <span id="toastMessage">संदेश कॉपी किया गया</span>
  </div>

  <script>
    // =========================================================
    // STEP 1 SE MILA APNA '/exec' URL YAHAN PASTE KAREIN:
    // =========================================================
    const APPS_SCRIPT_API_URL = "YAHAN_APNA_EXEC_URL_PASTE_KAREIN";

    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
    let currentFontSize = Number(localStorage.getItem('gyanhub_font')) || 17;
    let allAssistants = [];
    let allModes = [];
    let activeAssistant = null;
    let activeModeId = null;
    let pendingImage = null;

    let isRecordingVoice = false;
    let recognition = null;
    let audioContext = null;
    let analyserNode = null;
    let micStream = null;
    let waveAnimFrame = null;
    let capturedVoiceText = "";

    const THEME_MAP = {
      '#9a3412': { bg: 'bg-amber-700', hover: 'hover:bg-amber-800', softBg: 'bg-amber-50', softText: 'text-amber-900', border: 'border-amber-200', pill: 'bg-amber-700 text-white border-amber-700', bubble: 'bg-amber-700 text-white' },
      '#075e54': { bg: 'bg-emerald-700', hover: 'hover:bg-emerald-800', softBg: 'bg-emerald-50', softText: 'text-emerald-900', border: 'border-emerald-200', pill: 'bg-emerald-700 text-white border-emerald-700', bubble: 'bg-emerald-700 text-white' }
    };

    function getThemeClasses(hexColor) {
      if (THEME_MAP[hexColor]) return THEME_MAP[hexColor];
      return { bg: 'bg-indigo-600', hover: 'hover:bg-indigo-700', softBg: 'bg-indigo-50', softText: 'text-indigo-900', border: 'border-indigo-200', pill: 'bg-indigo-600 text-white border-indigo-600', bubble: 'bg-indigo-600 text-white' };
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateFontDisplay();
      buildWaveBars();
      checkLogin();
      fetchBootstrapData();

      document.addEventListener('click', (e) => {
        const dd = document.getElementById('headerDropdown');
        const btn = document.getElementById('headerMenuBtn');
        if (dd && btn && !dd.contains(e.target) && !btn.contains(e.target)) dd.classList.add('hidden');
      });
    });

    function buildWaveBars() {
      const c = document.getElementById('waveBarsContainer');
      c.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const b = document.createElement('div');
        b.className = 'wave-bar bg-emerald-600';
        c.appendChild(b);
      }
    }

    // CORS-Safe Fetch to Google Apps Script
    function callBackend(action, dataObj) {
      if (!APPS_SCRIPT_API_URL || APPS_SCRIPT_API_URL.includes("YAHAN_APNA")) {
        return Promise.reject(new Error("APPS_SCRIPT_API_URL सेट नहीं है।"));
      }
      return fetch(APPS_SCRIPT_API_URL, {
        method: 'POST',
        redirect: 'follow',
        body: JSON.stringify({ action, ...dataObj })
      })
      .then(r => r.json())
      .then(res => {
        if (action === 'chat') return res.reply;
        return res;
      });
    }

    function setConnectionUI(connected, subtitle) {
      const badge = document.getElementById('headerConnBadge');
      const subEl = document.getElementById('headerSubtitle');
      const sideText = document.getElementById('backendStatusText');
      const pingDot = document.getElementById('syncPingDot');
      const solidDot = document.getElementById('syncSolidDot');

      if (connected) {
        badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
        badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Connected';
        const cleanSub = (subtitle || '').replace(/^[●\s]*ऑनलाइन\s*[•·-]?\s*/i, '').trim();
        subEl.textContent = cleanSub;
        sideText.textContent = 'Backend Synced';
        pingDot.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
        solidDot.className = 'relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500';
      } else {
        badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200';
        badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> कनेक्ट हो रहा है...';
        subEl.textContent = '';
        sideText.textContent = 'Connecting...';
      }
    }

    function fetchBootstrapData(forceClear = false) {
      setConnectionUI(false, '');
      callBackend(forceClear ? 'refreshCache' : 'bootstrap', {})
        .then(res => {
          if (res && res.success && res.assistants && res.assistants.length > 0) {
            allAssistants = res.assistants;
            allModes = res.modes || [];
            renderSidebar();

            const savedId = localStorage.getItem('gyanhub_active_ast');
            const initialId = allAssistants.some(a => a.id === savedId) ? savedId : allAssistants[0].id;
            selectAssistant(initialId);
          }
        })
        .catch(err => showToast('कनेक्शन त्रुटि: ' + err.message));
    }

    function syncBackendModes() {
      const icon = document.getElementById('syncIcon');
      icon.classList.add('animate-spin');
      fetchBootstrapData(true);
      setTimeout(() => {
        icon.classList.remove('animate-spin');
        showToast('सभी असिस्टेंट और मोड्स सिंक हो गए हैं');
      }, 900);
    }

    function renderSidebar() {
      const listEl = document.getElementById('assistantList');
      document.getElementById('assistantCountBadge').textContent = allAssistants.length;

      listEl.innerHTML = allAssistants.map(ast => {
        const isSelected = activeAssistant && ast.id === activeAssistant.id;
        const t = getThemeClasses(ast.primaryColor);
        const modeCount = allModes.filter(m => m.assistantId === ast.id).length;
        const cleanSub = (ast.subtitle || '').replace(/^[●\s]*ऑनलाइन\s*[•·-]?\s*/i, '').trim();

        return `
          <button onclick="selectAssistant('${ast.id}')" class="w-full flex items-center gap-3 p-2.5 rounded-xl text-left transition-all ${isSelected ? `${t.softBg} ${t.border} border shadow-2xs` : 'hover:bg-slate-100 border border-transparent'}">
            <div class="w-10 h-10 rounded-xl ${t.bg} text-white flex items-center justify-center shrink-0">
              <i data-lucide="${ast.id === 'VASTU' ? 'compass' : 'sprout'}" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-slate-900 truncate">${ast.name}</p>
              <p class="text-xs text-slate-500 truncate mt-0.5">${cleanSub}</p>
              <span class="mt-1 inline-block text-[10px] font-medium px-1.5 py-0.2 bg-white text-slate-600 rounded border border-slate-200/80">${modeCount} मोड्स उपलब्ध</span>
            </div>
          </button>`;
      }).join('');
      lucide.createIcons();
    }

    function selectAssistant(id) {
      const ast = allAssistants.find(a => a.id === id) || allAssistants[0];
      if (!ast) return;
      activeAssistant = ast;
      localStorage.setItem('gyanhub_active_ast', ast.id);

      const t = getThemeClasses(ast.primaryColor);
      const headerAvatar = document.getElementById('headerAvatar');
      headerAvatar.className = `w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0 shadow-xs ${t.bg}`;
      headerAvatar.innerHTML = `<i data-lucide="${ast.id === 'VASTU' ? 'compass' : 'sprout'}" class="w-5 h-5"></i>`;

      document.getElementById('headerTitle').textContent = ast.name;
      document.getElementById('messageInput').placeholder = ast.placeholder || 'अपना प्रश्न लिखें...';
      setConnectionUI(true, ast.subtitle);

      const astModes = allModes.filter(m => m.assistantId === ast.id);
      activeModeId = astModes.length > 0 ? astModes[0].modeId : 'DEFAULT';

      renderSidebar();
      renderModesBar(astModes, t);
      renderChatMessages(ast, t);
      updatePrimaryActionBtn();

      const sidebar = document.getElementById('sidebar');
      if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) toggleSidebar();
    }

    function renderModesBar(modesList, t) {
      const container = document.getElementById('modePillsContainer');
      container.innerHTML = modesList.map(m => {
        const isActive = m.modeId === activeModeId;
        const cleanLabel = m.label.replace('(Default)', '').trim();
        return `
          <button onclick="selectMode('${m.modeId}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border transition-all shrink-0 ${isActive ? t.pill : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
            <span>${cleanLabel}</span>
          </button>`;
      }).join('');
    }

    function selectMode(modeId) {
      activeModeId = modeId;
      const astModes = allModes.filter(m => m.assistantId === activeAssistant.id);
      const t = getThemeClasses(activeAssistant.primaryColor);
      renderModesBar(astModes, t);
      const mObj = astModes.find(m => m.modeId === modeId);
      if (mObj) showToast('मोड: ' + mObj.label.replace('(Default)', '').trim());
    }

    function getStorageKey(astId) { return 'gyanhub_30d_' + (astId || 'ACU').toUpperCase(); }

    function loadHistory(astId) {
      try {
        const raw = localStorage.getItem(getStorageKey(astId));
        if (!raw) return [];
        const valid = JSON.parse(raw).filter(m => (Date.now() - m.timestamp) <= THIRTY_DAYS_MS);
        localStorage.setItem(getStorageKey(astId), JSON.stringify(valid));
        return valid;
      } catch (e) { return []; }
    }

    function saveMessage(astId, role, text, modeLabel, suggestions = []) {
      const list = loadHistory(astId);
      list.push({ role, text, modeLabel, suggestions, timestamp: Date.now() });
      localStorage.setItem(getStorageKey(astId), JSON.stringify(list.slice(-150)));
    }

    function renderChatMessages(ast, t) {
      const wrapper = document.getElementById('messagesWrapper');
      const history = loadHistory(ast.id);

      let html = `
        <div class="flex justify-center">
          <span class="px-3 py-1 rounded-full bg-slate-200/70 text-slate-600 text-[11px] font-medium">आज</span>
        </div>
        <div class="flex justify-start msg-animate">
          <div class="max-w-[90%] sm:max-w-[80%] rounded-2xl rounded-tl-xs p-4 bg-white border border-slate-200/80 text-slate-800 shadow-2xs">
            <div style="font-size:${currentFontSize}px">${escapeHtml(ast.welcomeMsg || 'प्रणाम! मैं आपकी क्या सहायता कर सकता हूँ?')}</div>
          </div>
        </div>`;

      history.forEach((msg, idx) => {
        const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).toLowerCase();
        if (msg.role === 'user') {
          html += `
            <div class="flex justify-end msg-animate">
              <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-xs px-4 py-3 ${t.bubble} shadow-xs">
                <p class="leading-relaxed whitespace-pre-wrap" style="font-size:${currentFontSize}px">${escapeHtml(msg.text)}</p>
                <div class="mt-1 flex items-center justify-end gap-1 text-[10px] opacity-80"><span>${timeStr}</span></div>
              </div>
            </div>`;
        } else {
          const isLast = idx === history.length - 1;
          const sugs = isLast ? (msg.suggestions || []) : [];
          const msgId = 'msg_' + msg.timestamp + '_' + idx;
          html += `
            <div class="flex justify-start msg-animate">
              <div class="max-w-[92%] sm:max-w-[82%] rounded-2xl rounded-tl-xs p-4 bg-white border border-slate-200/80 text-slate-800 shadow-2xs">
                ${msg.modeLabel ? `<div class="mb-2 inline-flex items-center px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 text-[10px] font-medium">${escapeHtml(msg.modeLabel)}</div>` : ''}
                <div id="${msgId}" class="ai-rich-body leading-relaxed whitespace-pre-wrap" style="font-size:${currentFontSize}px">${formatRichText(msg.text)}</div>
                ${sugs.length > 0 ? `
                  <div class="mt-3 pt-2.5 border-t border-slate-100 flex flex-wrap gap-1.5">
                    ${sugs.map(q => `<button type="button" onclick="sendSuggested('${escapeJs(q)}')" class="text-left text-xs px-3 py-1.5 rounded-xl border ${t.border} ${t.softBg} ${t.softText} font-medium hover:opacity-80">${escapeHtml(q)}</button>`).join('')}
                  </div>` : ''}
                <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-slate-400">
                  <button type="button" onclick="copyMsg('${msgId}')" class="inline-flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-slate-100 text-slate-600 text-xs font-medium">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i><span>कॉपी करें</span>
                  </button>
                  <span class="text-[11px]">${timeStr}</span>
                </div>
              </div>
            </div>`;
        }
      });

      wrapper.innerHTML = html;
      lucide.createIcons();
      scrollToBottom();
    }

    function updatePrimaryActionBtn() {
      const btn = document.getElementById('primaryActionBtn');
      const icon = document.getElementById('primaryActionIcon');
      const t = activeAssistant ? getThemeClasses(activeAssistant.primaryColor) : getThemeClasses('#075e54');

      if (isRecordingVoice) {
        btn.className = 'p-2.5 rounded-xl text-white bg-emerald-600 animate-pulse shadow-xs shrink-0 flex items-center justify-center';
        icon.setAttribute('data-lucide', 'check');
        lucide.createIcons();
        return;
      }

      const hasText = document.getElementById('messageInput').value.trim().length > 0;
      const hasImg = pendingImage !== null;

      btn.className = `p-2.5 rounded-xl text-white ${t.bg} ${t.hover} shadow-xs transition-all shrink-0 flex items-center justify-center`;
      icon.setAttribute('data-lucide', (hasText || hasImg) ? 'send-horizontal' : 'mic');
      lucide.createIcons();
    }

    function onInputTextChanged(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 128) + 'px';
      updatePrimaryActionBtn();
    }

    function handlePrimaryActionClick() {
      if (isRecordingVoice) { finishVoiceRecording(); return; }
      const hasText = document.getElementById('messageInput').value.trim().length > 0;
      if (hasText || pendingImage) sendChatQuery();
      else startVoiceRecording();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (document.getElementById('messageInput').value.trim() || pendingImage) sendChatQuery();
      }
    }

    // Live Audio Wave + Speech-to-Text (Works smoothly on Vercel!)
    async function startVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { showToast('इस ब्राउज़र में वॉइस टाइपिंग उपलब्ध नहीं है'); return; }

      capturedVoiceText = "";
      isRecordingVoice = true;
      document.getElementById('messageInput').classList.add('hidden');
      document.getElementById('attachBtn').classList.add('hidden');
      document.getElementById('voiceWaveBox').classList.remove('hidden');
      document.getElementById('voiceWaveBox').classList.add('flex');
      updatePrimaryActionBtn();

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioContext.createMediaStreamSource(micStream);
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 64;
        src.connect(analyserNode);

        const bars = document.querySelectorAll('#waveBarsContainer .wave-bar');
        const dataArr = new Uint8Array(analyserNode.frequencyBinCount);
        function drawWave() {
          if (!isRecordingVoice || !analyserNode) return;
          analyserNode.getByteFrequencyData(dataArr);
          bars.forEach((b, i) => {
            const h = Math.max(5, Math.min(26, Math.round(((dataArr[i % dataArr.length] || 0) / 255) * 26)));
            b.style.height = h + 'px';
          });
          waveAnimFrame = requestAnimationFrame(drawWave);
        }
        drawWave();
      } catch (e) {}

      try {
        recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (ev) => {
          let txt = '';
          for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
          capturedVoiceText = txt.trim();
          if (capturedVoiceText) document.getElementById('voiceLiveLabel').textContent = '✓ ' + capturedVoiceText.slice(-15);
        };
        recognition.onerror = (ev) => {
          if (ev.error === 'not-allowed') {
            alert('कृपया ब्राउज़र में माइक्रोफ़ोन की अनुमति (Allow) दें।');
            cancelVoiceRecording();
          }
        };
        recognition.start();
      } catch (e) { cancelVoiceRecording(); }
    }

    function stopVoiceHardware() {
      isRecordingVoice = false;
      if (waveAnimFrame) cancelAnimationFrame(waveAnimFrame);
      if (recognition) { try { recognition.stop(); } catch (e) {} recognition = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioContext) { try { audioContext.close(); } catch (e) {} audioContext = null; }

      document.getElementById('voiceWaveBox').classList.add('hidden');
      document.getElementById('voiceWaveBox').classList.remove('flex');
      document.getElementById('attachBtn').classList.remove('hidden');
      document.getElementById('messageInput').classList.remove('hidden');
    }

    function finishVoiceRecording() {
      const spoken = capturedVoiceText;
      stopVoiceHardware();
      if (spoken) {
        const inp = document.getElementById('messageInput');
        inp.value = (inp.value.trim() ? inp.value.trim() + ' ' : '') + spoken;
        onInputTextChanged(inp);
        inp.focus();
      }
      updatePrimaryActionBtn();
    }

    function cancelVoiceRecording() {
      capturedVoiceText = "";
      stopVoiceHardware();
      updatePrimaryActionBtn();
    }

    function sendSuggested(q) {
      document.getElementById('messageInput').value = q;
      sendChatQuery();
    }

    function sendChatQuery() {
      const inp = document.getElementById('messageInput');
      const text = inp.value.trim();
      const imgObj = pendingImage;
      if (!text && !imgObj) return;

      const ast = activeAssistant;
      const t = getThemeClasses(ast.primaryColor);
      const mObj = allModes.find(m => m.modeId === activeModeId);
      const modeLabel = mObj ? mObj.label.replace('(Default)', '').trim() : 'सामान्य';

      const priorHistory = loadHistory(ast.id).slice(-5).map(m => ({
        role: m.role,
        text: m.text,
        timeAgo: Math.max(1, Math.floor((Date.now() - m.timestamp) / 60000)) + ' mins ago'
      }));

      const displayUserTxt = text || '📷 संलग्न चित्र का विश्लेषण करें';
      saveMessage(ast.id, 'user', imgObj ? `[📷 चित्र] ${displayUserTxt}` : displayUserTxt, modeLabel, []);

      inp.value = '';
      inp.style.height = 'auto';
      removeAttachment();
      updatePrimaryActionBtn();
      renderChatMessages(ast, t);

      const wrapper = document.getElementById('messagesWrapper');
      const typingEl = document.createElement('div');
      typingEl.id = 'typingBubble';
      typingEl.className = 'flex justify-start msg-animate';
      typingEl.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl px-4 py-3 text-xs text-slate-500 italic">${(mObj && mObj.thinkingText) || '⟳ उत्तर तैयार हो रहा है...'}</div>`;
      wrapper.appendChild(typingEl);
      scrollToBottom();

      const payload = {
        assistantId: ast.id,
        modeId: activeModeId,
        query: text,
        imageData: imgObj ? { mimeType: imgObj.mimeType, base64: imgObj.base64 } : null,
        userName: localStorage.getItem('gyanhub_user') || 'M.K. Maurya',
        pin: localStorage.getItem('gyanhub_pin') || '',
        history: priorHistory
      };

      callBackend('chat', { payload })
        .then(rawReply => {
          const tb = document.getElementById('typingBubble');
          if (tb) tb.remove();

          const regex = /\[SUGGESTIONS\]([\s\S]*?)\[\/SUGGESTIONS\]/i;
          const match = (rawReply || '').match(regex);
          const cleanText = match ? rawReply.replace(regex, '').trim() : (rawReply || '').trim();
          const sugs = match ? match[1].split('\n').map(l => l.replace(/^[-*•\d.)\s]+/, '').trim()).filter(Boolean).slice(0, 2) : [];

          saveMessage(ast.id, 'model', cleanText, modeLabel, sugs);
          if (activeAssistant.id === ast.id) renderChatMessages(ast, t);
        })
        .catch(err => {
          const tb = document.getElementById('typingBubble');
          if (tb) tb.remove();
          showToast('त्रुटि: ' + err.message);
        });
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX = 1024;
          let w = img.width, h = img.height;
          if (w > h && w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          else if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          pendingImage = { mimeType: 'image/jpeg', base64: dataUrl.split(',')[1], dataUrl, name: file.name };
          document.getElementById('attachmentThumb').src = dataUrl;
          document.getElementById('attachmentName').textContent = file.name;
          document.getElementById('attachmentPreview').classList.remove('hidden');
          updatePrimaryActionBtn();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function removeAttachment() {
      pendingImage = null;
      document.getElementById('attachmentPreview').classList.add('hidden');
      updatePrimaryActionBtn();
    }

    function checkLogin() {
      const name = localStorage.getItem('gyanhub_user');
      const pin = localStorage.getItem('gyanhub_pin');
      if (name) {
        document.getElementById('sidebarUserName').textContent = name;
        document.getElementById('userInitialAvatar').textContent = name.charAt(0).toUpperCase();
      }
      if (!name || !pin) {
        document.getElementById('authModal').classList.remove('hidden');
        document.getElementById('authModal').classList.add('flex');
      }
    }

    function submitAuthLogin() {
      const name = document.getElementById('authNameInput').value.trim();
      const pin = document.getElementById('authPinInput').value.trim();
      const errEl = document.getElementById('authErrorMsg');
      if (!name || !pin) { errEl.textContent = 'नाम और पिन दोनों दर्ज करें'; errEl.classList.remove('hidden'); return; }

      callBackend('login', { userName: name, pin, deviceInfo: navigator.userAgent })
        .then(res => {
          if (res && res.success) {
            localStorage.setItem('gyanhub_user', name);
            localStorage.setItem('gyanhub_pin', pin);
            document.getElementById('sidebarUserName').textContent = name;
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('authModal').classList.remove('flex');
          } else {
            errEl.textContent = (res && res.message) || 'अमान्य पिन';
            errEl.classList.remove('hidden');
          }
        })
        .catch(e => { errEl.textContent = e.message; errEl.classList.remove('hidden'); });
    }

    function logoutUser() {
      localStorage.removeItem('gyanhub_pin');
      document.getElementById('headerDropdown').classList.add('hidden');
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('authModal').classList.add('flex');
    }

    function clearCurrentChat() {
      if (!activeAssistant) return;
      localStorage.removeItem(getStorageKey(activeAssistant.id));
      document.getElementById('headerDropdown').classList.add('hidden');
      renderChatMessages(activeAssistant, getThemeClasses(activeAssistant.primaryColor));
      showToast('वर्तमान चैट साफ़ की गई');
    }

    function exportChat() {
      if (!activeAssistant) return;
      const list = loadHistory(activeAssistant.id);
      const txt = list.map(m => `[${new Date(m.timestamp).toLocaleString()}] ${m.role === 'user' ? 'आप' : activeAssistant.name}:\n${m.text}`).join('\n\n---\n\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
      a.download = `${activeAssistant.name.replace(/\s+/g, '_')}_Chat.txt`;
      a.click();
      document.getElementById('headerDropdown').classList.add('hidden');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('mobileOverlay').classList.toggle('hidden');
    }

    function toggleHeaderMenu() { document.getElementById('headerDropdown').classList.toggle('hidden'); }

    function changeFontSize(delta) {
      currentFontSize = Math.min(24, Math.max(14, currentFontSize + delta));
      localStorage.setItem('gyanhub_font', currentFontSize);
      updateFontDisplay();
      if (activeAssistant) renderChatMessages(activeAssistant, getThemeClasses(activeAssistant.primaryColor));
    }

    function updateFontDisplay() {
      document.getElementById('fontSizeDisplay').textContent = currentFontSize + 'px';
      const mob = document.getElementById('fontSizeDisplayMobile');
      if (mob) mob.textContent = currentFontSize;
    }

    function copyMsg(id) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.innerText).then(() => showToast('उत्तर कॉपी किया गया'));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2500);
    }

    function scrollToBottom() {
      const c = document.getElementById('chatContainer');
      c.scrollTop = c.scrollHeight;
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeJs(s) {
      return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function formatRichText(text) {
      let safe = escapeHtml(text);
      safe = safe.replace(/^#{1,4}\s+(.+)$/gm, '<span class="ai-heading">$1</span>');
      safe = safe.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      safe = safe.replace(/(?<!\w)\*([^*\n]+)\*(?!\w)/g, '<b>$1</b>');
      safe = safe.replace(/(?<!\w)_([^_\n]+)_(?!\w)/g, '<em>$1</em>');
      safe = safe.replace(/^[*-]\s+(.+)$/gm, '• $1');
      return safe;
    }
  </script>
</body>
